<form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-4">
  <div class="grid gap-4 sm:grid-cols-2">
    <label class="grid gap-1">
      Tipo de documento
      <input class="rounded border border-slate-300 p-2" formControlName="document_type" />
    </label>
    <label class="grid gap-1">
      Número de documento *
      <input class="rounded border border-slate-300 p-2" formControlName="document_number" required />
      @if (form.controls.document_number.touched && form.controls.document_number.invalid) {
        <span class="text-sm text-red-700">El número de documento es obligatorio (máximo 50 caracteres).</span>
      }
    </label>
    <label class="grid gap-1">
      Nombres *
      <input class="rounded border border-slate-300 p-2" formControlName="first_name" autocomplete="given-name" required />
      @if (form.controls.first_name.touched && form.controls.first_name.invalid) {
        <span class="text-sm text-red-700">Este campo es obligatorio (máximo 100 caracteres).</span>
      }
    </label>
    <label class="grid gap-1">
      Apellidos *
      <input class="rounded border border-slate-300 p-2" formControlName="last_name" autocomplete="family-name" required />
      @if (form.controls.last_name.touched && form.controls.last_name.invalid) {
        <span class="text-sm text-red-700">Este campo es obligatorio (máximo 100 caracteres).</span>
      }
    </label>
    <label class="grid gap-1">
      Teléfono
      <input class="rounded border border-slate-300 p-2" formControlName="phone" autocomplete="tel" />
    </label>
    <label class="grid gap-1">
      Correo electrónico
      <input class="rounded border border-slate-300 p-2" type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="text-sm text-red-700">Revisa el formato del correo (máximo 150 caracteres).</span>
      }
    </label>
  </div>
  <div class="flex justify-end gap-2 border-t border-slate-200 pt-4">
    <button class="rounded border border-slate-300 px-4 py-2" type="button" (click)="cancelled.emit()">Cancelar</button>
    <button class="rounded bg-blue-700 px-4 py-2 text-white disabled:opacity-50" type="submit" [disabled]="saving()">
      {{ saving() ? 'Guardando…' : 'Guardar' }}
    </button>
  </div>
</form>
